<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Favicon -->
      <link
         rel="shortcut icon"
         href="img/icons8-chat-64.png"
         type="image/x-icon"
      />

      <!-- Font Awesome -->
      <link
         rel="stylesheet"
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
         integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk="
         crossorigin="anonymous"
      />

      <!-- Main CSS -->
      <link rel="stylesheet" href="css/style.css" />

      <!-- Website Title -->
      <title>XeroxChat | Real-Time Chat</title>
   </head>

   <body>

      <div class="chat-container">

         <!-- Header -->
         <header class="chat-header">
            <h1 style="color: #f5f6f7">
               <i class="fas fa-comment-dots"></i>
               XeroxChat
            </h1>

            <a href="index.html" class="btn">
               Leave Room
            </a>
         </header>

         <!-- Main Chat Area -->
         <main class="chat-main">

            <!-- Sidebar -->
            <div class="chat-sidebar">

               <h3>
                  <i class="fas fa-comments"></i>
                  Room Name:
               </h3>

               <h2 id="room-name"></h2>

               <h3>
                  <i class="fas fa-users"></i>
                  Users
               </h3>

               <ul id="users"></ul>

            </div>

            <!-- Chat Messages -->
            <div class="chat-messages"></div>

         </main>

         <!-- Message Form -->
         <div class="chat-form-container">

            <form id="chat-form">

               <input
                  id="msg"
                  type="text"
                  placeholder="Enter Message"
                  required
                  autocomplete="off"
               />

               <button class="btn send-button">
                  <i class="fas fa-paper-plane"></i>
                  Send
               </button>

            </form>

         </div>

      </div>

      <!-- Footer -->
      <footer style="margin-top: 25px">

         <div
            style="text-align: center; color: #f5f6f7"
            class="credit"
         >
            © 2026 Yash Vidhate | XeroxChat
         </div>

      </footer>

      <!-- QS Library -->
      <script
         src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.10.1/qs.min.js"
         integrity="sha512-aTKlYRb1QfU1jlF3k+aS4AqTpnTXci4R79mkdie/bp6Xm51O5O3ESAYhvg6zoicj/PD6VYY0XrYwsWLcvGiKZQ=="
         crossorigin="anonymous"
      ></script>

      <!-- Socket.IO -->
      <script src="/socket.io/socket.io.js"></script>

      <!-- Main Script -->
      <script src="js/script.js"></script>

   </body>
</html>
